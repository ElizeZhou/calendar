<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的行事曆</title>
<meta name="theme-color" content="#f0e6e6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="行事曆">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* 紅黑配色：黑底＋光澤紅（上方粉灰反光、中間深紅、下方亮紅）＋白色描邊 */
  :root{
    --bg:#f0e6e6; --card:#ffffff; --ink:#1d1a1b; --muted:#6f666a; --line:rgba(0,0,0,.16); --line2:rgba(0,0,0,.08);
    --accent:#e0101e; --accent-soft:rgba(224,16,30,.14); --today:#5e0808; --sun:#ff4655; --sat:#ff4655;
    --c1:#ffffff; --c2:#ff8a3d; --c3:#2ea7ff; --hol:#2ea7ff; --c4:#82037E; --c5:#014209; --c6:#ff3b3b; --c7:#FFE218; --c8:#FB6482;
    --radius:14px;
    --gloss:linear-gradient(180deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,.22) 46%,rgba(255,255,255,0) 52%,rgba(255,255,255,.08) 100%),#5e0808;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .app{max-width:1200px;margin:0 auto;padding:20px;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px}
  header{grid-column:1/-1;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  h1{font-size:26px;margin:0;font-weight:700;letter-spacing:.02em}
  .tbox{position:relative}
  .tbtn{font:inherit;border:none;background:none;padding:4px 8px;margin-left:-8px;border-radius:10px;display:inline-flex;align-items:center;gap:8px;color:inherit}
  .tbtn:hover{background:var(--card);border:none}
  .caret{font-size:14px;color:var(--muted)}
  .ympop{position:absolute;top:calc(100% + 6px);left:0;z-index:30;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;width:290px;box-shadow:0 10px 30px rgba(0,0,0,.15)}
  .yrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .yrow span{font-size:18px;font-weight:700}
  .yrow button{padding:6px 12px}
  .mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .mgrid button{padding:10px 0}
  .mgrid button.now{border-color:var(--accent);color:var(--accent)}
  .cbox{position:relative}
  .calbtn{display:inline-flex;align-items:center;gap:6px;font-weight:500;max-width:240px}
  #calName{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}
  .calpop{position:absolute;top:calc(100% + 6px);left:0;z-index:30;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;width:300px;box-shadow:0 10px 30px rgba(0,0,0,.15)}
  .ctitle{font-size:12px;color:var(--muted);padding:2px 6px 6px}
  .crow{display:flex;align-items:center;gap:2px;border-radius:10px}
  .crow.on{background:var(--accent-soft)}
  .crow .cname{flex:1;text-align:left;border:none;background:none;padding:9px 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .crow.on .cname{font-weight:700;color:#5e0808}
  .crow .ic{border:none;background:none;padding:6px 8px;color:var(--muted);flex:none}
  .crow .ic:hover{color:var(--ink)}
  .impbtn{width:100%;margin-top:8px;border-style:dashed;color:var(--muted);font-size:14px}
  .crow .ic.pen{font-size:24px;line-height:1;padding:2px 7px}
  .crow .ic.danger{color:#fff;background:var(--sun);border-radius:8px;font-size:12px}
  .cedit{display:flex;gap:4px;flex:1;padding:4px}
  .cedit input{flex:1;min-width:0;padding:6px 8px}
  .cedit button{padding:6px 10px;font-size:13px}
  .caladd{display:flex;gap:6px;margin-top:8px;border-top:1px solid var(--line);padding-top:10px}
  .caladd input{flex:1;min-width:0;padding:8px 10px}
  .caladd button{padding:8px 12px}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;
    z-index:80;max-width:min(92vw,520px);box-shadow:0 8px 24px rgba(0,0,0,.25);word-break:break-all}
  .csub{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:1px;white-space:normal;line-height:1.4}
  .members{width:100%;font-size:13px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
  .cnote{font-size:11px;color:var(--muted);padding:8px 6px 0;line-height:1.5}
  .nav{display:flex;gap:6px;margin-left:auto;align-items:center}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 14px}
  button:hover{border-color:var(--accent)}
  .primary,.cell.today .num,.addc,.mgrid button.on,#loginBtn{background:var(--gloss);color:#fff;border:1.5px solid #fff;font-weight:700;
    text-shadow:0 1px 1px rgba(0,0,0,.4);box-shadow:0 2px 10px rgba(94,8,8,.35),inset 0 1px 0 rgba(255,255,255,.5)}
  .primary:hover,#loginBtn:hover{filter:brightness(1.1);border-color:#fff}
  .cal,aside,.calpop,.ympop,.modal,.members{border-color:var(--line)}
  .account{width:100%;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .status{font-size:12px;color:var(--muted)}
  #who{font-size:12px;color:var(--ink);margin-left:auto}
  #loginBtn{margin-left:auto;padding:6px 12px;font-size:13px}
  #logoutBtn{padding:6px 12px;font-size:13px}
  .hint{font-size:12px;color:var(--muted);width:100%}
  /* 白色背景＋黑色半透明卡片：卡片裡用淺色字和淺色格線 */
  .cal,aside{--ink:#f7f4f4;--muted:#bdb4b7;--line:rgba(255,255,255,.22);--line2:rgba(255,255,255,.1);color:var(--ink);border-color:rgba(0,0,0,.6)!important}
  .cal{background:#000;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 8px 24px rgba(0,0,0,.18);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  /* month */
  .dow,.mrow{display:grid;grid-template-columns:repeat(7,1fr)}
  .mrow{position:relative}
  .track{position:relative}
  .peek{position:absolute;top:0;width:100%;pointer-events:none}
  .peek.next{left:100%} .peek.prev{right:100%}
  .dow div{padding:10px 0;text-align:center;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line)}
  .dow div:first-child,.dow div:last-child{color:var(--sun)}
  .cell{min-height:120px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;cursor:pointer;position:relative;overflow:hidden}
  .cell.last{border-right:none}
  .cell.other{opacity:.38}
  .mbar.oth{opacity:.38}
  .cell.sel{background:color-mix(in srgb,var(--accent) 18%,transparent)}
  .cell.drop{background:color-mix(in srgb,var(--accent) 30%,transparent)}
  .mbar{position:absolute;height:19px;line-height:19px;font-size:12px;padding:0 8px;border-radius:5px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    cursor:grab;z-index:2;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:pan-y}
  .mbar.cl{border-top-left-radius:0;border-bottom-left-radius:0;margin-left:calc(var(--bx) * -1);padding-left:12px}
  .mbar.cr{border-top-right-radius:0;border-bottom-right-radius:0}
  .mrow{--bx:4px}
  .mbar .rh{position:absolute;right:0;top:0;bottom:0;width:9px;cursor:ew-resize;touch-action:none}
  .mbar .rh::after{content:"";position:absolute;right:3px;top:5px;bottom:5px;width:2px;border-radius:1px;background:currentColor;opacity:.5}
  .mbar.dragging{opacity:.85;z-index:20;box-shadow:0 8px 20px rgba(0,0,0,.6),0 0 0 1.5px var(--accent)}
  body.mdrag .mbar{pointer-events:none}
  body.mdrag,body.mdrag *{cursor:grabbing!important}
  .addc{display:block;margin:2px 0 0;width:26px;height:26px;padding:0;border-radius:50%;
    font-size:16px;line-height:23px;text-align:center;z-index:3;animation:pop .15s ease-out}
  .addc:hover{filter:brightness(1.1)}
  @keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
  .mrow.hasadd .cell{min-height:148px}
  .mbar.hol{--col:var(--hol);color:#fff;font-weight:700;cursor:default;pointer-events:none}
  .holname{color:var(--hol);font-weight:700;font-size:14px;margin:-2px 0 10px}
  .num{font-size:13px;font-weight:500;display:inline-flex;width:26px;height:26px;align-items:center;justify-content:center;border-radius:50%}
  .cell.today .num{color:#fff}
  .ev{font-size:12px;line-height:1.3;padding:2px 6px;margin-top:3px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  .ev:hover{filter:brightness(1.06);box-shadow:0 1px 4px rgba(0,0,0,.18)}
  .more{font-size:12px;font-weight:700;color:#ff4655;position:absolute;left:8px;line-height:16px;white-space:nowrap}
  .dots{display:none;gap:3px;justify-content:center;margin-top:2px}
  .dot{width:7px;height:7px;border-radius:50%}
  /* 整月備忘 */
  .memo{grid-column:1;background:#000;--ink:#f7f4f4;--muted:#bdb4b7;--line:rgba(255,255,255,.22);--line2:rgba(255,255,255,.1);color:var(--ink);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 8px 24px rgba(0,0,0,.18);border:1px solid rgba(0,0,0,.6);border-radius:var(--radius);padding:16px 18px 18px}
  .memohd{display:block;font-size:18px;font-weight:700;margin:0 0 10px;color:var(--ink)}
  .memo textarea{width:100%;min-height:72px;background:rgba(255,255,255,.06);color:var(--ink);border:1px solid var(--line2);border-radius:10px;
    padding:10px 12px;font:inherit;font-size:16px;line-height:1.55;resize:none;overflow:hidden;box-sizing:border-box;display:block;margin:0}
  .memo textarea:focus{outline:none;border-color:#f0e6e6;background:rgba(255,255,255,.09)}
  /* side list */
  aside{background:#000;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 8px 24px rgba(0,0,0,.18);border:1px solid var(--line);border-radius:var(--radius);padding:18px;align-self:start}
  aside h2{margin:0 0 10px;font-size:18px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:10px}
  .sub:empty{display:none}
  .item.lift{position:relative;z-index:5;background:#1a1a1a;box-shadow:0 10px 24px rgba(0,0,0,.6),0 0 0 1.5px var(--accent);transition:none!important;cursor:grabbing}
  .item.shift{transition:transform .15s ease}
  .item{touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;position:relative;overflow:hidden;border-radius:10px;cursor:pointer;border:1px solid transparent}
  .icont{display:flex;gap:10px;padding:10px;background:transparent;position:relative;z-index:1;transition:transform .2s ease}
  .item.swiping .icont,.item.open .icont{background:#000}
  .item.swiping .icont{transition:none}
  /* 手機左滑露出的刪除按鈕 */
  .sdel{position:absolute;top:0;right:0;bottom:0;width:84px;border:none;border-radius:0;padding:0;color:#fff;font-weight:700;font-size:14px;
    background:var(--gloss);text-shadow:0 1px 1px rgba(0,0,0,.4)}
  .sdel.sure{font-size:13px}
  .sdel{visibility:hidden} .item.swiping .sdel,.item.open .sdel{visibility:visible}
  .item:hover{border-color:var(--line)}
  .bar{width:4px;border-radius:2px;flex:none}
  .item .t{font-size:12px;color:var(--muted)} .item .n{font-weight:500}
  .item .note{font-size:12px;color:var(--muted);margin-top:2px;white-space:pre-wrap}
  .multi{font-size:11px;color:var(--muted);margin-top:2px}
  .empty{color:var(--muted);font-size:14px;padding:20px 0;text-align:center}
  /* modal */
  .mask{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;padding:16px;z-index:60}
  .mask.open{display:flex}
  .modal{background:var(--card);border-radius:18px;padding:22px;width:100%;max-width:440px;max-height:calc(100vh - 32px);overflow-y:auto}
  .modal h3{margin:0 0 14px}
  label,.lbl{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
  input,textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
  textarea{min-height:70px;resize:vertical}
  input[type=date]{cursor:pointer}
  .slot{display:grid;grid-template-columns:1fr 1fr 32px;gap:8px;padding:10px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;align-items:end}
  .slot>*{min-width:0}
  .slot input{min-width:0;width:100%;box-sizing:border-box;padding:8px 10px}
  .slot .rm{grid-column:3;grid-row:1;padding:0;width:32px;height:32px;border-radius:50%;color:var(--muted);font-size:16px;line-height:1;align-self:center}
  .slot .tm span{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
  .addslot{width:100%;border-style:dashed;color:var(--accent);font-size:14px;padding:8px}
  .colors{display:flex;gap:10px;margin-top:4px;flex-wrap:wrap}
  .sw{width:28px;height:28px;border-radius:50%;cursor:pointer}
  .sw.on{outline:2.5px solid var(--ink);outline-offset:2px}
  .actions{display:flex;gap:8px;margin-top:18px}
  .actions .del{color:var(--sun);margin-right:auto}
  /* 玻璃亮面：清透的底色＋上半部亮面反光（中間有清楚的分界）＋白色亮邊 */
  .jelly,.mbar.hol{
    background-color:color-mix(in srgb,var(--col) 78%,transparent);
    background-image:linear-gradient(180deg,rgba(255,255,255,.88) 0%,rgba(255,255,255,.45) 46%,rgba(255,255,255,.06) 50%,rgba(255,255,255,0) 72%,rgba(255,255,255,.28) 100%);
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.7),
      inset 0 0 0 1.5px color-mix(in srgb,var(--col) 45%,transparent),
      inset 0 -2px 3px color-mix(in srgb,var(--col) 35%,transparent),
      0 2px 6px color-mix(in srgb,var(--col) 28%,transparent)}
  .mbar.jelly,.mbar.hol{border-radius:8px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45);font-weight:500}
  .mbar.hol{font-weight:700}
  .w{color:#1f2328 !important}
  .mbar.jelly.w:not(.wh){color:#1d1a1b !important;text-shadow:0 1px 0 rgba(255,255,255,.5)}
  /* 第一個顏色：不要白色底，只有白色字 */
  .jelly.wh{background:none!important;box-shadow:none!important}
  .mbar.jelly.dk{color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.5)}
  .mbar.jelly.wh{color:#fff!important;text-shadow:0 1px 2px rgba(0,0,0,.6);font-weight:500}
  .mbar.jelly.wh:hover{box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)!important}
  .bar.jelly.wh{background:#fff!important}
  .sw.wh{display:flex;align-items:center;justify-content:center;color:var(--ink);font-size:13px;font-weight:700;box-shadow:inset 0 0 0 1.5px #7a6f73!important}
  .dot.jelly,.bar.jelly{background-color:color-mix(in srgb,var(--col) 70%,transparent)}
  .mbar.jelly:hover{filter:brightness(1.05) saturate(1.1)}
  .fab{display:none}
  /* phone */
  @media (max-width:760px){
    .app{grid-template-columns:1fr;padding:12px;gap:12px}
    h1{font-size:20px}
    .tbox{width:100%}
    .nav{margin-left:0;width:100%}
    .nav .sp{flex:1}
    #addBtn{display:none}
    .app{padding:10px}
    .cell{min-height:104px;padding:3px 2px;text-align:center}
    .mrow{--bx:1px}
    .mbar{height:16px;line-height:16px;font-size:9.5px;padding:0 1px;border-radius:4px !important;letter-spacing:-.06em;text-overflow:clip}
    .mbar.cl{padding-left:2px}
    .mbar.hasrh{padding-right:1px}
    .mbar .rh{width:12px;background:none}
    .mbar .rh::after{display:block;right:1px;top:3px;bottom:3px;width:2px;border-radius:1px;opacity:.6;background:currentColor}
    .num{width:24px;height:24px;font-size:12px}
    .more{left:0;right:0;text-align:center;font-size:10px;line-height:14px}
    .addc{margin:1px auto 0;width:20px;height:20px;line-height:20px;font-size:13px}
    .mrow.hasadd .cell{min-height:126px}
    .cal{border-radius:12px}
    .fab{display:flex;position:fixed;right:18px;bottom:22px;width:56px;height:56px;border-radius:50%;font-size:28px;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.25);padding:0;z-index:40}
    aside{padding:14px}
    .memo{padding:14px;margin-bottom:80px}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="tbox">
      <h1><button type="button" class="tbtn" id="titleBtn" aria-haspopup="true" aria-expanded="false" title="選擇年份和月份"><span id="title"></span><span class="caret">▾</span></button></h1>
      <div class="ympop" id="ympop" hidden>
        <div class="yrow"><button type="button" id="yPrev" aria-label="前一年">‹</button><span id="yLab"></span><button type="button" id="yNext" aria-label="後一年">›</button></div>
        <div class="mgrid" id="mGrid"></div>
      </div>
    </div>
    <div class="nav">
      <div class="cbox">
        <button type="button" class="calbtn" id="calBtn" aria-haspopup="true" aria-expanded="false" title="切換或新增日曆"><span id="calName"></span><span class="caret">▾</span></button>
        <div class="calpop" id="calpop" hidden>
          <div class="ctitle">切換日曆</div>
          <div id="calList"></div>
          <div class="cnote">🔗 第一本以外的日曆可以複製連結，邀請別人一起編輯</div>
          <form id="calAdd" class="caladd"><input id="calNew" maxlength="20" placeholder="請輸入日曆名稱" aria-label="新日曆名稱"><button type="submit" class="primary">新增</button></form>
          <button type="button" id="impBtn" class="impbtn">匯入行程到這本日曆</button>
          <input type="file" id="impFile" accept=".ics,.json,text/calendar,application/json" hidden>
        </div>
      </div>
      <span class="sp"></span>
      <button id="prev" aria-label="上一頁">‹</button>
      <button id="todayBtn">今天</button>
      <button id="next" aria-label="下一頁">›</button>
      <button class="primary" id="addBtn">＋ 新增行程</button>
    </div>
    <div class="account">
      <span class="status" id="status">載入中…</span>
      <span id="who"></span>
      <button id="loginBtn" style="display:none">用 Google 登入同步</button>
      <button id="logoutBtn" style="display:none">登出</button>
    </div>
    <div class="members" id="members" hidden></div>
  </header>

  <div class="cal">
    <div id="monthView">
      <div class="dow"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div>
      <div class="track" id="track"><div class="grid" id="grid"></div></div>
    </div>
  </div>

  <aside>
    <h2 id="dayTitle"></h2>
    <div class="holname" id="dayHol" hidden></div>
    <div class="sub" id="daySub"></div>
    <div id="list"></div>
  </aside>

  <section class="memo">
    <label class="memohd" for="memo" id="memoTitle"></label>
    <textarea id="memo" maxlength="3000" rows="3"></textarea>
  </section>
</div>

<button class="primary fab" id="fab" aria-label="新增行程">＋</button>
<div class="toast" id="toast" role="status" hidden></div>

<div class="mask" id="mask">
  <form class="modal" id="form">
    <h3 id="formTitle">新增行程</h3>
    <label for="fTitle">標題</label>
    <input id="fTitle" required maxlength="80">
    <span class="lbl">日期</span>
    <div id="slots"></div>
    <button type="button" class="addslot" id="addSlot">＋ 新增日期</button>
    <label for="fNote">備註</label>
    <textarea id="fNote" maxlength="500"></textarea>
    <label>顏色</label>
    <div class="colors" id="colors"></div>
    <div class="actions">

/* ---------- storage: cloud (syncs phone + computer) with local fallback ---------- */
const LS_KEY="my-calendar-events";
function loadLocal(){try{events=JSON.parse(localStorage.getItem(LS_KEY)||"{}")}catch(e){events={}}}
function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(events))}catch(e){}}
function setStatus(t){$("status").textContent=t}
function loadLocalMemos(){try{memos=JSON.parse(localStorage.getItem(MEMO_KEY)||"{}")}catch(e){memos={}}}
function saveLocalMemos(){try{localStorage.setItem(MEMO_KEY,JSON.stringify(memos))}catch(e){}}

// 沒登入：資料存在這台裝置。登入後：資料存在 Firebase，電腦和手機同步。
// 第一本日曆存在 users/{uid}/events，只有自己看得到；
// 其他日曆存在 calendars/{id}，可以複製連結邀請別人一起編輯。
let nameFixed=new Set(), unsubs=[], calUnsubs={}, personal={}, shared={}, settingsRef=null, sharedMeta=[], mainName=DEFAULT_CAL.name;
function stopAll(){unsubs.forEach(u=>u());unsubs=[];Object.values(calUnsubs).forEach(u=>u());calUnsubs={};personal={};shared={};sharedMeta=[];mainName=DEFAULT_CAL.name;memos={}}
const memoRef=k=>{const [cal,ym]=k.split("|"); return cal==="main"?doc(fdb,"users",myUid,"memos",ym):doc(fdb,"calendars",cal,"memos",ym)};
function setMemos(cal,snap){for(const k of Object.keys(memos)) if(k.startsWith(cal+"|")) delete memos[k]; snap.forEach(d=>{memos[cal+"|"+d.id]=d.data().text||""}); renderMemo()}
function rebuild(){
  const all={};
  for(const [id,e] of Object.entries(personal)) all[id]={...e,cal:"main"};
  for(const [cid,evs] of Object.entries(shared)) for(const [id,e] of Object.entries(evs)) all[id]={...e,cal:cid};
  events=all;
  setCals([{id:"main",name:mainName},...sharedMeta]); render();
}
function initStore(){
  loadLocal(); loadLocalCals(); loadLocalMemos(); render();
  onAuthStateChanged(auth, async user=>{
    stopAll();
    if(!user){
      myUid=null; myName=null; store=null; settingsRef=null; loadLocal(); loadLocalCals(); loadLocalMemos(); render();
      $("who").textContent=""; $("loginBtn").style.display=""; $("logoutBtn").style.display="none";
      setStatus(pendingJoin?"👋 要加入朋友分享的日曆，請先按右邊的「用 Google 登入同步」":"尚未登入：資料只存在這台裝置");
      return;
    }
    myUid=user.uid; myName=user.displayName||(user.email||"").split("@")[0]||"使用者";
    $("who").textContent=user.displayName||user.email||"";
    $("loginBtn").style.display="none"; $("logoutBtn").style.display="";
    store=collection(fdb,"users",user.uid,"events");
    settingsRef=doc(fdb,"users",user.uid,"meta","settings");   // 第一本日曆的名稱
    setStatus("同步中…");
    await migrateLocal();
    if(pendingJoin) await joinCal(pendingJoin);
    unsubs.push(onSnapshot(collection(fdb,"users",user.uid,"memos"),s=>setMemos("main",s),err=>console.error(err)));
    unsubs.push(onSnapshot(settingsRef,s=>{mainName=(s.exists()&&s.data().mainName)||DEFAULT_CAL.name;rebuild()},err=>console.error(err)));
    const timer=setTimeout(()=>setStatus("暫時連不上雲端，顯示的可能不是最新資料"),10000);
    unsubs.push(onSnapshot(store,{includeMetadataChanges:true},snap=>{
      personal={}; snap.forEach(d=>{personal[d.id]=d.data()}); rebuild();
      if(!snap.metadata.fromCache){clearTimeout(timer);setStatus("☁️ 已同步")}
    },err=>{clearTimeout(timer);console.error(err);setStatus("同步失敗："+(err.code||err.message))}));
    // 我參與的共用日曆（自己建立的＋別人邀請的）
    unsubs.push(onSnapshot(query(collection(fdb,"calendars"),where("members","array-contains",user.uid)),snap=>{
      const list=[], ids=new Set();
      snap.forEach(d=>{const x=d.data(); ids.add(d.id); list.push({id:d.id,name:x.name||"未命名日曆",owner:x.owner,members:x.members||[],names:x.names||{},created:x.created||0,shared:true});
        // 讓其他成員看得到我的名字（名字沒寫過或改過時才更新）
        if((x.names||{})[user.uid]!==myName&&!nameFixed.has(d.id)){nameFixed.add(d.id);updateDoc(doc(fdb,"calendars",d.id),{["names."+user.uid]:myName}).catch(e=>console.error(e))}
      });
      sharedMeta=list.sort((a,b)=>a.created-b.created);
      for(const id of Object.keys(calUnsubs)) if(!ids.has(id)){calUnsubs[id]();delete calUnsubs[id];delete shared[id]}
      ids.forEach(id=>{
        if(calUnsubs[id]) return;
        const u1=onSnapshot(collection(fdb,"calendars",id,"events"),s=>{const m={};s.forEach(d=>{m[d.id]=d.data()});shared[id]=m;rebuild()},err=>console.error(err));
        const u2=onSnapshot(collection(fdb,"calendars",id,"memos"),s=>setMemos(id,s),err=>console.error(err));
        calUnsubs[id]=()=>{u1();u2()};
      });
      rebuild();
    },err=>{console.error(err);setStatus("讀取共用日曆失敗："+(err.code||err.message)+"（請確認 Firebase 規則已更新）")}));
  });
}

async function joinCal(id){

// 第一次登入時，把這台裝置原本存的行程和日曆搬到雲端
async function migrateLocal(){
  let local={}; try{local=JSON.parse(localStorage.getItem(LS_KEY)||"{}")}catch(e){}
  let lc=null; try{lc=JSON.parse(localStorage.getItem(CAL_KEY)||"null")}catch(e){}
  let lm={}; try{lm=JSON.parse(localStorage.getItem(MEMO_KEY)||"{}")}catch(e){}
  const ids=Object.keys(local), mks=Object.keys(lm).filter(k=>lm[k]);
  if(!ids.length&&!Array.isArray(lc)&&!mks.length) return;
  try{
    const cloudCals=new Set();
    if(Array.isArray(lc)) for(const c of lc){
      if(c.id==="main"){ if(c.name&&c.name!==DEFAULT_CAL.name) await setDoc(settingsRef,{mainName:c.name},{merge:true}); continue; }
      await setDoc(doc(fdb,"calendars",c.id),{name:c.name,owner:myUid,members:[myUid],names:{[myUid]:myName},created:Date.now()}); cloudCals.add(c.id);
    }
    for(let i=0;i<ids.length;i+=400){
      const b=writeBatch(fdb);
      ids.slice(i,i+400).forEach(id=>{const {cal,...e}=local[id]; b.set(cloudCals.has(cal)?doc(fdb,"calendars",cal,"events",id):doc(store,id),e)});
      await b.commit();
    }
    for(const k of mks){const cal=k.split("|")[0]; if(cal==="main"||cloudCals.has(cal)) await setDoc(memoRef(k),{text:lm[k],updated:Date.now()})}
    localStorage.removeItem(LS_KEY); localStorage.removeItem(CAL_KEY); localStorage.removeItem(MEMO_KEY);
  }catch(e){console.error(e)}
}
const evRef=(id,cal)=>cal&&cal!=="main"?doc(fdb,"calendars",cal,"events",id):doc(store,id);
async function saveEvent(id,data){
  if(store){ const {cal,...d}=data; try{await setDoc(evRef(id,cal),d)}catch(e){setStatus("儲存失敗："+(e.code||e.message))} return; }
  events[id]=data; saveLocal(); render();
}
async function deleteEvent(id){
  if(store){ try{await deleteDoc(evRef(id,events[id]?.cal))}catch(e){setStatus("刪除失敗："+(e.code||e.message))} return; }
  delete events[id]; saveLocal(); render();
}
async function saveMemo(k,text){
  if(store){ try{ text.trim()?await setDoc(memoRef(k),{text,updated:Date.now()}):await deleteDoc(memoRef(k)) }catch(e){setStatus("備忘儲存失敗："+(e.code||e.message)+"（請確認 Firebase 規則已更新）")} return; }
  if(text.trim()) memos[k]=text; else delete memos[k]; saveLocalMemos();
}
async function addCal(name){
  const id=rid(); curCal=id; try{localStorage.setItem("cal-current",id)}catch(e){}
  if(store){
    const data={name,owner:myUid,members:[myUid],names:{[myUid]:myName},created:Date.now()};
    sharedMeta=[...sharedMeta,{id,...data,shared:true}]; rebuild();
    try{await setDoc(doc(fdb,"calendars",id),data)}catch(e){setStatus("新增日曆失敗："+(e.code||e.message)+"（請確認 Firebase 規則已更新）")}
    return;
  }
  setCals([...cals,{id,name}]); saveLocalCals(); render();
}
async function renameCal(id,name){
  if(store){
    try{
      if(id==="main"){mainName=name;rebuild();await setDoc(settingsRef,{mainName:name},{merge:true})}
      else await updateDoc(doc(fdb,"calendars",id),{name});
    }catch(e){setStatus("改名失敗："+(e.code||e.message))}
    return;
  }
  setCals(cals.map(c=>c.id===id?{...c,name}:c)); saveLocalCals(); render();
}
// 自己建立的日曆：刪除（連同行程）；別人分享的：離開
async function removeCal(id){
  if(id==="main") return;
  if(store){
    const c=cals.find(x=>x.id===id); if(!c) return;
    try{
      if(c.owner===myUid){
        const ids=Object.keys(shared[id]||{});
        for(let i=0;i<ids.length;i+=400){const b=writeBatch(fdb); ids.slice(i,i+400).forEach(eid=>b.delete(doc(fdb,"calendars",id,"events",eid))); await b.commit()}
        for(const k of Object.keys(memos).filter(k=>k.startsWith(id+"|"))) await deleteDoc(memoRef(k));
        await deleteDoc(doc(fdb,"calendars",id));
      }else await updateDoc(doc(fdb,"calendars",id),{members:arrayRemove(myUid),["names."+myUid]:deleteField()});
    }catch(e){setStatus("操作失敗："+(e.code||e.message))}
    return;
  }
  Object.entries(events).filter(([,e])=>calOf(e)===id).forEach(([i])=>delete events[i]); saveLocal();
  Object.keys(memos).filter(k=>k.startsWith(id+"|")).forEach(k=>delete memos[k]); saveLocalMemos();
  setCals(cals.filter(c=>c.id!==id)); saveLocalCals(); render();
}

/* ---------- data helpers ---------- */
// 一個行程可以有多組日期：slots=[{date(開始日期),endDate(結束日期，可空)},...]
function slotsOf(e){
  const sl=(Array.isArray(e.slots)&&e.slots.length)?e.slots:[{date:e.date}];
  return sl.map(x=>({date:x.date,endDate:(x.endDate&&x.endDate>x.date)?x.endDate:""}));
}
function sortSlots(sl){return sl.sort((a,b)=>(a.date+a.endDate).localeCompare(b.date+b.endDate))}
const addDays=(k,n)=>{const d=parse(k);d.setDate(d.getDate()+n);return ymd(d)};
const diffDays=(a,b)=>Math.round((Date.UTC(...b.split("-").map((v,i)=>i===1?v-1:+v))-Date.UTC(...a.split("-").map((v,i)=>i===1?v-1:+v)))/864e5);
const md=k=>{const d=parse(k);return (d.getMonth()+1)+"/"+d.getDate()};
function ranges(){ // 每個時間點＝一段日期
  const out=[];
  for(const [id,e] of Object.entries(events)){
    if(calOf(e)!==curCal) continue;   // 只顯示目前這本日曆
    const sl=slotsOf(e);
    sl.forEach((x,si)=>out.push({id,si,order:e.order,title:e.title,note:e.note,color:e.color||"c1",ds:x.date,de:x.endDate||x.date,n:sl.length}));
  }
  return out;
}
function byDate(){ // 展開成每一天
  const m={};
  ranges().forEach(r=>{
    const len=Math.min(diffDays(r.ds,r.de),366);
    for(let i=0;i<=len;i++){const k=addDays(r.ds,i);(m[k]=m[k]||[]).push({...r,date:k})}
  });
  for(const k in m) m[k].sort((a,b)=>ordOf(a)-ordOf(b)||a.ds.localeCompare(b.ds)||a.title.localeCompare(b.title));
  return m;
}
const ordOf=e=>e.order==null?1e15:e.order;  // 同一天的排列順序（拖曳調整）
function timeText(e){return e.de!==e.ds?md(e.ds)+" – "+md(e.de):""}
async function updateSlot(id,si,patch){
  const e=events[id]; if(!e) return;
  const slots=slotsOf(e); slots[si]={...slots[si],...patch};
  slots.forEach(x=>{if(!x.endDate||x.endDate<=x.date)x.endDate=""});
  sortSlots(slots);
  await saveEvent(id,{title:e.title,note:e.note||"",color:e.color||"c1",cal:calOf(e),slots,date:slots[0].date,...(e.order!=null?{order:e.order}:{})});
}
const colorOf=(el,c)=>{el.style.setProperty("--col","var(--"+c+")"); el.classList.add("jelly"); if(LIGHT.has(c)) el.classList.add("w"); if(c==="c1") el.classList.add("wh"); if(c==="c5") el.classList.add("dk")};

/* ---------- rendering ---------- */
function render(){
  const map=byDate();
  $("calName").textContent=curName();
  const cc=cals.find(c=>c.id===curCal);  // 目前這本是共用日曆 → 顯示成員名字
  const mem=cc&&(cc.members||[]).length>1;

  if(!$("calpop").hidden&&calEdit===null) drawCals();
  renderMonth(map); renderDay(map); renderMemo();
}

function fillMonth(grid,v,map,live){
  const today=ymd(new Date()), selected=live?SEL():"";

    const segs=[...hols,...all.filter(r=>r.ds<=weK&&r.de>=wsK)].map(r=>({...r,
      c0:Math.max(0,diffDays(wsK,r.ds)), c1:Math.min(6,diffDays(wsK,r.de)), contL:r.ds<wsK, contR:r.de>weK, nolab:r.ds<wsK&&w>0}));  // 跨週接續的那段不重複顯示名稱（第一週除外）
    segs.sort((a,b)=>(b.hol?1:0)-(a.hol?1:0)||ordOf(a)-ordOf(b)||a.c0-b.c0||(b.c1-b.c0)-(a.c1-a.c0)||a.title.localeCompare(b.title));
    const lanes=[]; const hidden=Array(7).fill(0);
    // 每一列記錄哪幾天被佔用；放得下（那幾天都空著）就放進最上面的那一列
    segs.forEach(s=>{const fits=occ=>{for(let c=s.c0;c<=s.c1;c++) if(occ[c]) return false; return true};
      let l=lanes.findIndex(fits); if(l<0){l=lanes.length;lanes.push(Array(7).fill(false))}
      for(let c=s.c0;c<=s.c1;c++) lanes[l][c]=true; s.lane=l;
      if(l>=MAXLANE) for(let c=s.c0;c<=s.c1;c++) hidden[c]++});
    for(let i=0;i<7;i++){

      const cell=document.createElement("div"); cell.dataset.date=key;

      const num=document.createElement("span"); num.className="num"; num.textContent=d.getDate();

      if(d.getDay()===6&&key!==today) num.style.color="var(--sun)";
      if(d.getDay()%6!==0&&key!==today&&holidayOf(key)) num.style.color="var(--hol)";
      cell.appendChild(num);
      if(key===selected){ // 點選的日期出現「＋」，按下去新增這天的行程
        const add=document.createElement("button"); add.type="button"; add.className="addc"; add.textContent="＋";
        add.setAttribute("aria-label",(d.getMonth()+1)+" 月 "+d.getDate()+" 日新增行程"); add.title="新增這天的行程";
        add.onclick=ev=>{ev.stopPropagation();openForm(null,key)}; add.ondblclick=ev=>ev.stopPropagation();
        cell.appendChild(add);

      const dots=document.createElement("div"); dots.className="dots";

      cell.appendChild(dots);

      let out=true; for(let c=s.c0;c<=s.c1;c++) if(addDays(wsK,c).startsWith(ym)) out=false;

    grid.appendChild(row);

}

let drag=null;
function startTouchOrCapture(ev,el,activate){
  if(drag.touch) drag.timer=setTimeout(()=>{if(drag&&drag.el===el){activate();try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}}},350);
  else { try{el.setPointerCapture(ev.pointerId)}catch(e){} ev.preventDefault() }
}
function passedThreshold(ev,activate){ // 回傳 true＝開始拖曳

  if(Math.hypot(ev.clientX-d.x0,ev.clientY-d.y0)<5) return false;
  if(d.touch){clearTimeout(d.timer);drag=null;return false}   // 手機上沒長按就滑動＝捲動畫面
  activate(); return true;
}
// 月曆長條：拖曳換日期、拉右邊緣改結束日期
function barDown(ev,s,el,row,kind){
  if(ev.button>0) return; ev.stopPropagation();
  const r=row.getBoundingClientRect(), col=Math.min(6,Math.max(0,Math.floor((ev.clientX-r.left)/(r.width/7))));
  drag={type:"bar",s,el,kind,x0:ev.clientX,y0:ev.clientY,pid:ev.pointerId,touch:ev.pointerType!=="mouse",active:false,
        grab:addDays(row.dataset.start,col),nds:s.ds,nde:s.de};
  if(kind==="resize"&&drag.touch){ // 手機：按住右邊拉把就直接開始拉長，不用長按
    try{el.setPointerCapture(ev.pointerId)}catch(e){} ev.preventDefault(); barActivate(); return;
  }

}
function barActivate(){drag.active=true;drag.el.classList.add("dragging");document.body.classList.add("mdrag")}
function barMove(ev){
  if(!passedThreshold(ev,barActivate)) return;
  const d=drag, k=document.elementFromPoint(ev.clientX,ev.clientY)?.closest(".cell")?.dataset.date;
  d.dy=ev.clientY-d.y0; d.mx=Math.max(d.mx||0,Math.abs(ev.clientX-d.x0));
  if(d.kind==="move") d.el.style.transform="translate("+(ev.clientX-d.x0)+"px,"+d.dy+"px)";
  if(!k) return;
  if(d.kind==="move"){const n=diffDays(d.grab,k); d.nds=addDays(d.s.ds,n); d.nde=addDays(d.s.de,n)}
  else{d.nds=d.s.ds; d.nde=k<d.s.ds?d.s.ds:k}
  document.querySelectorAll(".cell.drop").forEach(c=>c.classList.remove("drop"));
  document.querySelectorAll(".cell").forEach(c=>{if(c.dataset.date>=d.nds&&c.dataset.date<=d.nde)c.classList.add("drop")});

async function barUp(){
  const d=drag; drag=null; clearTimeout(d.timer);

  document.querySelectorAll(".cell.drop").forEach(c=>c.classList.remove("drop"));
  if(d.active){
    if(d.nds!==d.s.ds||d.nde!==d.s.de){
      if(d.kind==="move"&&!(selected>=d.nds&&selected<=d.nde)) selected=d.nds;
      await updateSlot(d.s.id,d.s.si,{date:d.nds,endDate:d.nde>d.nds?d.nde:""});
    } else if(d.kind==="move"&&Math.abs(d.dy||0)>10){
      // 在同一格裡上下拖：調整這一天的行程順序
      const step=Math.round((d.dy)/(isPhone()?18:22))||Math.sign(d.dy);
      const ids=[...new Set((byDate()[d.grab]||[]).map(e=>e.id))], i=ids.indexOf(d.s.id);
      if(i<0){render();return}
      const to=Math.max(0,Math.min(ids.length-1,i+step));

      ids.splice(i,1); ids.splice(to,0,d.s.id); await saveOrders(ids);
    } else if(d.kind==="resize"&&(d.mx||0)<8) openForm(d.s.id);   // 只是點到右邊拉把＝打開編輯

// 當天清單：按住行程上下拖曳，調整同一天的順序（手機要長按再拖）
// 手機：清單裡的行程往左滑，露出「刪除」
const DELW=84;
function closeSwipes(except){document.querySelectorAll("#list .item.open").forEach(x=>{if(x!==except){x.classList.remove("open");x.querySelector(".icont").style.transform="";const b=x.querySelector(".sdel");b.classList.remove("sure");b.textContent="刪除"}})}
function swipeDel(it,ic){
  let sx=null,sy=0,dx=0,mode=null;
  it.addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;dx=0;mode=null},{passive:true});
  it.addEventListener("touchmove",e=>{
    if(sx===null||(drag&&drag.active)) return;
    dx=e.touches[0].clientX-sx; const dy=e.touches[0].clientY-sy;
    if(!mode){ if(Math.abs(dx)<8&&Math.abs(dy)<8) return; mode=Math.abs(dx)>Math.abs(dy)?"h":"v"; if(mode==="h"){closeSwipes(it);it.classList.add("swiping")} }
    if(mode!=="h") return;
    const base=it.classList.contains("open")?-DELW:0;
    ic.style.transform="translateX("+Math.max(-DELW-20,Math.min(0,base+dx))+"px)";
  },{passive:true});
  const end=()=>{
    if(sx===null) return; sx=null; it.classList.remove("swiping"); if(mode!=="h") return;
    const base=it.classList.contains("open")?-DELW:0, pos=base+dx;
    if(pos<-DELW/2){it.classList.add("open");ic.style.transform="translateX(-"+DELW+"px)"}
    else{closeSwipes();it.classList.remove("open");ic.style.transform=""}

function listDown(ev,e,el){
  if(ev.button>0) return;

  closeSwipes();

  drag={type:"list",e,el,items,x0:ev.clientX,y0:ev.clientY,pid:ev.pointerId,touch:ev.pointerType!=="mouse",active:false,idx:items.indexOf(el),to:items.indexOf(el)};
  startTouchOrCapture(ev,el,()=>listActivate());
}
function listActivate(){
  const d=drag; d.active=true; d.rects=d.items.map(x=>x.getBoundingClientRect());
  d.items.forEach(x=>{if(x!==d.el)x.classList.add("shift")}); d.el.classList.add("lift");

function listMove(ev){
  if(!passedThreshold(ev,listActivate)) return;
  const d=drag, dy=ev.clientY-d.y0, r=d.rects[d.idx], h=r.height, mid=r.top+h/2+dy;
  d.el.style.transform="translateY("+dy+"px)";
  let to=0; d.rects.forEach((q,i)=>{if(i!==d.idx&&q.top+q.height/2<mid)to++}); d.to=to;
  d.items.forEach((x,i)=>{ if(i===d.idx) return;
    const s=(d.idx<to&&i>d.idx&&i<=to)?-h:(d.idx>to&&i>=to&&i<d.idx)?h:0;
    x.style.transform=s?"translateY("+s+"px)":"" });

async function listUp(){
  const d=drag; drag=null; clearTimeout(d.timer);
  if(!d.active){ if(!d.el.dataset.swiped) openForm(d.e.id); return; }
  const ids=d.items.map(x=>x.dataset.id); const [m]=ids.splice(d.idx,1); ids.splice(d.to,0,m);
  if(d.to===d.idx){ render(); return; }
  await saveOrders([...new Set(ids)]);

async function saveOrders(ids){ // 依新順序重新編號 0,10,20…，只存有變的

// ---- 匯入行程（.ics 或整理好的 .json）到目前這本日曆 ----
function icsDate(v){const m=String(v||"").match(/(\d{4})(\d{2})(\d{2})/);return m?m[1]+"-"+m[2]+"-"+m[3]:""}
function parseICS(txt){
  const lines=txt.replace(/\r\n[ \t]/g,"").replace(/\n[ \t]/g,"").split(/\r?\n/); const out=[]; let ev=null;
  const un=v=>v.replace(/\\n/gi,"\n").replace(/\\([,;\\])/g,"$1");
  for(const ln of lines){
    if(ln==="BEGIN:VEVENT"){ev={};continue}
    if(ln==="END:VEVENT"){if(ev&&ev.date)out.push(ev);ev=null;continue}
    if(!ev)continue;
    const i=ln.indexOf(":"); if(i<0)continue; const key=ln.slice(0,i), val=ln.slice(i+1), k=key.split(";")[0].toUpperCase();
    if(k==="SUMMARY")ev.title=un(val).trim();
    else if(k==="DESCRIPTION")ev.note=un(val).trim();
    else if(k==="DTSTART"){ev.date=icsDate(val);ev.allDay=/VALUE=DATE/i.test(key)||!/T/.test(val)}
    else if(k==="DTEND")ev.end=icsDate(val);
  }
  return out.map(e=>{let end=e.end||"";
    if(end&&e.allDay){const d=parse(end);d.setDate(d.getDate()-1);end=ymd(d)} // 全天行程的結束日是「隔天」
    return {title:e.title||"（無標題）",date:e.date,endDate:end>e.date?end:"",note:e.note||""}});
}
const COLOR_NAMES={"字":"c1","白":"c1","橘":"c2","紫":"c4","綠":"c5","墨綠":"c5","紅":"c6","黃":"c7","粉":"c8","粉紅":"c8"};
function parseJSONImport(txt){
  let j=JSON.parse(txt); if(!Array.isArray(j)) j=j.events||[];
  return j.map(e=>{const date=e.date||e.start||"", end=e.endDate||e.end||"";
    const c=COLORS.includes(e.color)?e.color:(COLOR_NAMES[e.color]||"c1");
    return {title:String(e.title||"（無標題）").trim(),date,endDate:end>date?end:"",note:String(e.note||"").trim(),color:c}}).filter(e=>/^\d{4}-\d{2}-\d{2}$/.test(e.date));
}
$("impBtn").onclick=()=>$("impFile").click();
$("impFile").onchange=async ev=>{
  const f=ev.target.files[0]; ev.target.value=""; if(!f) return;
  let list=[];
  try{ const txt=await f.text(); list=/^\s*[\[{]/.test(txt)?parseJSONImport(txt):parseICS(txt) }
  catch(e){ showToast("這個檔案讀不懂，請確認是 .ics 或 .json 檔"); return }
  if(!list.length){ showToast("檔案裡沒有找到行程"); return }
  const have=new Set(Object.values(events).filter(e=>calOf(e)===curCal).flatMap(e=>slotsOf(e).map(x=>e.title+"|"+x.date+"|"+(x.endDate||""))));
  let n=0, skip=0; $("calpop").hidden=true;
  showToast("匯入中…（共 "+list.length+" 個）");
  for(const e of list){
    const k=e.title+"|"+e.date+"|"+(e.endDate||"");
    if(have.has(k)){skip++;continue} have.add(k);
    const id="e"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    await saveEvent(id,{title:e.title,note:e.note||"",color:e.color||"c1",cal:curCal,slots:[{date:e.date,endDate:e.endDate||""}],date:e.date});
    n++;
  }
  render();
  showToast("已匯入 "+n+" 個行程到「"+curName()+"」"+(skip?"（"+skip+" 個重複的已略過）":""));
};
$("delBtn").onclick=async()=>{
  if($("delBtn").dataset.confirm!=="1"){$("delBtn").dataset.confirm="1";$("delBtn").textContent="再按一次確認刪除";return}
  const id=editingId; closeForm(); if(id) await deleteEvent(id);
};
$("cancelBtn").onclick=closeForm;
$("mask").onclick=e=>{if(e.target===$("mask"))closeForm()};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeForm()});

/* ---------- 多個日曆：切換、新增、改名、刪除 ---------- */
let calEdit=null, calDel=null;
const mkBtn=(cls,txt,title)=>{const b=document.createElement("button");b.type="button";b.className=cls;b.textContent=txt;if(title){b.title=title;b.setAttribute("aria-label",title)}return b};
function drawCals(){
  const box=$("calList"); box.innerHTML="";
  cals.forEach((c,idx)=>{
    const row=document.createElement("div"); row.className="crow"+(c.id===curCal?" on":"");
    if(calEdit===c.id){
      const f=document.createElement("form"); f.className="cedit";
      const i=document.createElement("input"); i.value=c.name; i.maxLength=20; i.setAttribute("aria-label","日曆名稱");
      const ok=mkBtn("primary","儲存"); ok.type="submit"; const no=mkBtn("","取消");
      f.onsubmit=async ev=>{ev.preventDefault();const n=i.value.trim();if(!n)return;calEdit=null;await renameCal(c.id,n);drawCals()};
      no.onclick=()=>{calEdit=null;drawCals()};
      f.append(i,ok,no); row.appendChild(f); box.appendChild(row); setTimeout(()=>{i.focus();i.select()},0); return;
    }
    const mine=!c.owner||!myUid||c.owner===myUid;
    const nm=mkBtn("cname",c.name); nm.onclick=()=>switchCal(c.id);
    const n=(c.members||[]).length;
    if(!mine||n>1){const sb=document.createElement("span");sb.className="csub";sb.textContent=(mine?"":"別人分享給你・")+"共用中："+memberNames(c).join("、");nm.appendChild(sb)}
    const ed=mkBtn("ic pen","✎","重新命名「"+c.name+"」"); ed.onclick=()=>{calEdit=c.id;calDel=null;drawCals()};
    row.append(nm,ed);
    if(idx>0){ // 第一本日曆不能共用、不能刪除
      const sh=mkBtn("ic","🔗","複製「"+c.name+"」的邀請連結"); sh.onclick=()=>shareCal(c.id);
      const cnt=Object.values(events).filter(e=>calOf(e)===c.id).length;
      const del=calDel===c.id
        ? mkBtn("ic danger",mine?("確定刪除"+(cnt?"（含 "+cnt+" 個行程）":"")):"確定離開")
        : mkBtn("ic",mine?"🗑":"離開",(mine?"刪除":"離開")+"「"+c.name+"」");
      del.onclick=async()=>{
        if(calDel!==c.id){calDel=c.id;drawCals();return}
        calDel=null; await removeCal(c.id); drawCals();
      };
      row.append(sh,del);
    }
    box.appendChild(row);
  });
}
function switchCal(id){curCal=id;try{localStorage.setItem("cal-current",id)}catch(e){};closeCal();render()}
function openCal(){calEdit=null;calDel=null;drawCals();$("calpop").hidden=false;$("calBtn").setAttribute("aria-expanded","true")}
function closeCal(){$("calpop").hidden=true;calEdit=null;calDel=null;$("calBtn").setAttribute("aria-expanded","false")}
$("calBtn").onclick=ev=>{ev.stopPropagation();closeYM();$("calpop").hidden?openCal():closeCal()};
$("calpop").onclick=ev=>ev.stopPropagation();
$("calAdd").onsubmit=async ev=>{
  ev.preventDefault(); const n=$("calNew").value.trim(); if(!n) return;
  $("calNew").value=""; await addCal(n); closeCal();
};
document.addEventListener("click",()=>{if(!$("calpop").hidden)closeCal()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeCal()});

/* ---------- 選擇年份和月份 ---------- */
let pyear=view.getFullYear();
function drawYM(){
  $("yLab").textContent=pyear+" 年";
  const g=$("mGrid"); g.innerHTML=""; const now=new Date();
  for(let m=0;m<12;m++){
    const b=document.createElement("button"); b.type="button"; b.textContent=(m+1)+" 月";
    if(pyear===view.getFullYear()&&m===view.getMonth()) b.classList.add("on");
    else if(pyear===now.getFullYear()&&m===now.getMonth()) b.classList.add("now");
    b.onclick=()=>{view=new Date(pyear,m,1);closeYM();render()};
    g.appendChild(b);
  }
}
function openYM(){pyear=view.getFullYear();drawYM();$("ympop").hidden=false;$("titleBtn").setAttribute("aria-expanded","true")}
function closeYM(){$("ympop").hidden=true;$("titleBtn").setAttribute("aria-expanded","false")}
$("titleBtn").onclick=ev=>{ev.stopPropagation();closeCal();$("ympop").hidden?openYM():closeYM()};
$("ympop").onclick=ev=>ev.stopPropagation();
$("yPrev").onclick=()=>{pyear--;drawYM()};
$("yNext").onclick=()=>{pyear++;drawYM()};
document.addEventListener("click",()=>{if(!$("ympop").hidden)closeYM()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeYM()});

/* ---------- nav ---------- */
// 整月備忘：每本日曆、每個月各一份，打字後自動儲存
const ymKey=()=>view.getFullYear()+"-"+String(view.getMonth()+1).padStart(2,"0");
let memoTimer=null, memoPend=null;
function fitMemo(){const t=$("memo");t.style.height="auto";t.style.height=Math.max(72,t.scrollHeight+2)+"px"}
function flushMemo(){clearTimeout(memoTimer);memoTimer=null;if(memoPend){const p=memoPend;memoPend=null;saveMemo(p.k,p.v)}}
function renderMemo(){
  $("memoTitle").textContent=(view.getMonth()+1)+"月備忘錄";
  const t=$("memo"), k=curCal+"|"+ymKey();
  if(t.dataset.key===k&&document.activeElement===t) return;   // 正在打字時不要被同步蓋掉
  if(t.dataset.key!==k) flushMemo();
  t.dataset.key=k; t.value=memos[k]||""; fitMemo();
}
$("memo").addEventListener("input",()=>{const t=$("memo"),k=t.dataset.key; fitMemo(); memos[k]=t.value; memoPend={k,v:t.value}; clearTimeout(memoTimer); memoTimer=setTimeout(flushMemo,700)});
$("memo").addEventListener("blur",()=>{flushMemo();renderMemo()});
addEventListener("pagehide",flushMemo);
document.addEventListener("visibilitychange",()=>{if(document.hidden)flushMemo()});
function shift(n){
  view.setMonth(view.getMonth()+n);
  render();
}
$("prev").onclick=()=>shift(-1);
$("next").onclick=()=>shift(1);
$("todayBtn").onclick=()=>{view=new Date();view.setDate(1);selected=ymd(new Date());render()};
$("addBtn").onclick=()=>openForm(null);
$("fab").onclick=()=>openForm(null);
// 手機：左右滑動換月份／換天
// 手機：手指左右滑，月曆跟著移動（旁邊露出上／下個月）；放開後滑過去
function swipe(el){
  let sx=null,sy=0,dx=0,mode=null,busy=false;
  el.style.touchAction="pan-y";
  const go=(x,t)=>{el.style.transition=t?"transform "+t+"s cubic-bezier(.2,.8,.2,1)":"none";el.style.transform=x?"translateX("+x+"px)":""};
  const addPeeks=()=>{
    const map=byDate();
    [["prev",-1],["next",1]].forEach(([cls,n])=>{
      const g=document.createElement("div"); g.className="grid peek "+cls;
      fillMonth(g,new Date(view.getFullYear(),view.getMonth()+n,1),map,false); el.appendChild(g);
    });
  };
  const dropPeeks=()=>el.querySelectorAll(".peek").forEach(g=>g.remove());
  el.addEventListener("touchstart",e=>{if(busy||e.touches.length>1){sx=null;return} sx=e.touches[0].clientX;sy=e.touches[0].clientY;dx=0;mode=null;go(0)},{passive:true});
  el.addEventListener("touchmove",e=>{
    if(sx===null||(drag&&drag.active)) return;
    dx=e.touches[0].clientX-sx; const dy=e.touches[0].clientY-sy;
    if(!mode){ if(Math.abs(dx)<8&&Math.abs(dy)<8) return; mode=Math.abs(dx)>Math.abs(dy)?"h":"v";
      if(mode==="h"){ if(drag){clearTimeout(drag.timer);drag=null} addPeeks() } }
    if(mode!=="h") return;
    e.preventDefault(); go(dx);
  },{passive:false});
  const end=()=>{
    if(sx===null) return; sx=null; if(mode!=="h") return;
    const w=el.offsetWidth; busy=true;
    if(Math.abs(dx)>Math.min(80,w*.2)){
      const dir=dx<0?1:-1; go(-dir*w,.22);
      setTimeout(()=>{ shift(dir); dropPeeks(); go(0); busy=false },230);
    } else { go(0,.2); setTimeout(()=>{dropPeeks();busy=false},210) }
  };
  el.addEventListener("touchend",end); el.addEventListener("touchcancel",end);
}
swipe($("track"));
let lastPhone=isPhone(); addEventListener("resize",()=>{if(isPhone()!==lastPhone){lastPhone=isPhone();render()}});

initStore();
